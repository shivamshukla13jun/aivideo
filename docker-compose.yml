version: '3.8'

# ==============================================================================
# 🚀 AI Video Studio & Anime/Manga Docker Compose Stack
# ==============================================================================
# यह एकल कम्पोज़ फ़ाइल सभी 4 सेवाओं को चलाती है:
# 1. suwayomi: Suwayomi (Tachidesk) Anime/Manga Server (Port 4567)
# 2. mongodb: MongoDB Database (Port 27017)
# 3. backend: Node.js, Express, FFmpeg, Gemini AI Engine (Port 5000)
# 4. frontend: React, Vite, Nginx Web Server (Port 80)
#
# 📌 सभी सेटिंग्स एकल .env फ़ाइल से ली जाती हैं।
# 📌 चलाने का कमांड: docker compose up -d
# 📌 बंद करने का कमांड: docker compose down
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 📚 1. Suwayomi Anime & Manga Server
  # ---------------------------------------------------------------------------
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:latest
    container_name: aivideo-suwayomi
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - WEB_UI_ENABLED=true
      - TZ=Asia/Kolkata
    volumes:
      - suwayomi_data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - aivideo-network

  # ---------------------------------------------------------------------------
  # 🗄️ 2. MongoDB Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: aivideo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aivideo-network

  # ---------------------------------------------------------------------------
  # 🎬 3. AI Video Studio Backend (Unified Single Web Service: UI + API)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivideo-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/aivideo}
      - SUWAYOMI_URL=${SUWAYOMI_URL:-http://suwayomi:4567}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - mongodb
      - suwayomi
    networks:
      - aivideo-network

  # ---------------------------------------------------------------------------
  # 🌐 4. Frontend Web Studio
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aivideo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - suwayomi
    networks:
      - aivideo-network

# -----------------------------------------------------------------------------
# 💾 Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  suwayomi_data:
    name: aivideo_suwayomi_data
  mongodb_data:
    name: aivideo_mongodb_data
  backend_storage:
    name: aivideo_backend_storage

# -----------------------------------------------------------------------------
# 🔗 Network
# -----------------------------------------------------------------------------
networks:
  aivideo-network:
    name: aivideo-network
    driver: bridge
