services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    restart: unless-stopped

    ports:
      - "4567:4567"

    environment:
      TZ: Asia/Kolkata

      # Server
      BIND_IP: 0.0.0.0
      BIND_PORT: 4567

      # Headless/Docker
      WEB_UI_ENABLED: "true"

      # Download settings
      DOWNLOAD_AS_CBZ: "true"

      # Extension store
      EXTENSION_STORES: >-
        ["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]

      # Byparr / Cloudflare bypass
      FLARESOLVERR_ENABLED: "true"
      FLARESOLVERR_URL: "http://byparr:8191"

    depends_on:
      - byparr

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped

    environment:
      TZ: Asia/Kolkata

  manga-translator:
    image: zyddnys/manga-image-translator:main
    container_name: manga-translator
    restart: unless-stopped

    ports:
      - "5003:5003"

    ipc: host

    volumes:
      - manga_models:/app/models
      - manga_cache:/root/.cache
      - manga_result:/app/result

    entrypoint: python

    command:
      - server/main.py
      - --verbose
      - --start-instance
      - --host=0.0.0.0
      - --port=5003

