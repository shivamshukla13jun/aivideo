version: '3.8'

# ==============================================================================
# 🛠️ AI Video Studio: Development Docker Compose Stack (Live Hot Reload)
# ==============================================================================
# यह कम्पोज़ फ़ाइल डेवलपमेंट वातावरण के लिए है, जिसमें:
# 1. कोड में बदलाव करते ही लाइव हॉट रीलोड (Live Hot-Reload) होता है।
# 2. Suwayomi Server और MongoDB कंटेनर्स में चलते हैं।
# 3. Backend (5000) और Frontend (5173) सीधे डेवलपमेंट मोड में उपलब्ध रहते हैं।
#
# 📌 चलाने का कमांड:
# docker compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:latest
    container_name: aivideo-suwayomi-dev
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - WEB_UI_ENABLED=true
    volumes:
      - suwayomi_dev_data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - aivideo-dev-network

  mongodb:
    image: mongo:7
    container_name: aivideo-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - aivideo-dev-network

  backend:
    image: node:20-alpine
    container_name: aivideo-backend-dev
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/aivideo
      - SUWAYOMI_URL=http://suwayomi:4567
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "apk add --no-cache ffmpeg python3 make g++ && npm install && npm run dev"
    depends_on:
      - mongodb
      - suwayomi
    networks:
      - aivideo-dev-network

  frontend:
    image: node:20-alpine
    container_name: aivideo-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - aivideo-dev-network

volumes:
  suwayomi_dev_data:
  mongodb_dev_data:

networks:
  aivideo-dev-network:
    driver: bridge
