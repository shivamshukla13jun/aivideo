[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:suwayomi]
command=/home/suwayomi/startup_script.sh
user=suwayomi
directory=/home/suwayomi
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/suwayomi.log
stderr_logfile=/var/log/suwayomi.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:backend]
command=node dist/server.js
user=root
directory=/app/backend
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",IS_ALL_IN_ONE="true",PORT="5000",SUWAYOMI_URL="http://127.0.0.1:4567"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
