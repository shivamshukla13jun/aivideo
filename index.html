<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script type="module" src="/src/main.tsx"></script>

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
