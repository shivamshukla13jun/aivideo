version: '3.8'

# ==============================================================================
# 🚀 AI Video Studio & Anime/Manga Production Docker Compose Stack
# (Frontend Workspace Mirror)
# ==============================================================================

services:
  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:latest
    container_name: aivideo-suwayomi
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      - BIND_IP=0.0.0.0
      - BIND_PORT=4567
      - WEB_UI_ENABLED=true
      - TZ=Asia/Kolkata
    volumes:
      - suwayomi_data:/home/suwayomi/.local/share/Tachidesk
    networks:
      - aivideo-network

  mongodb:
    image: mongo:7
    container_name: aivideo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aivideo-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aivideo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/aivideo
      - SUWAYOMI_URL=http://suwayomi:4567
      - CLIENT_URL=http://localhost
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - mongodb
      - suwayomi
    networks:
      - aivideo-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aivideo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - suwayomi
    networks:
      - aivideo-network

volumes:
  suwayomi_data:
    name: aivideo_suwayomi_data
  mongodb_data:
    name: aivideo_mongodb_data
  backend_storage:
    name: aivideo_backend_storage

networks:
  aivideo-network:
    name: aivideo-network
    driver: bridge
